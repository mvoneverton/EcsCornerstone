# ── Railway monorepo configuration ───────────────────────────────────────────
# Defines two service configurations for Railway deployment.
# In the Railway dashboard, create two services pointing to this repo.
# Set each service's Root Directory to "/" and Railway will read this file.
#
# Docs: https://docs.railway.app/reference/config-as-code

# ── Service: api ─────────────────────────────────────────────────────────────
# The api service also serves the built web SPA (see packages/api/src/index.ts,
# production static-file block), so the build MUST compile packages/web too or
# every non-/api route 500s with ENOENT on packages/web/dist/index.html.
# --include=dev is required: NODE_ENV=production on this service otherwise makes
# npm skip the devDependencies that vite/tsc need to build.
[services.api.build]
builder      = "nixpacks"
buildCommand = "npm install --include=dev --legacy-peer-deps && npm run build --workspace=packages/web && npm run build --workspace=packages/api"

[services.api.deploy]
startCommand            = "npm --prefix packages/api run db:migrate && node packages/api/dist/index.js"
healthcheckPath         = "/api/health"
healthcheckTimeout      = 300
restartPolicyType       = "on_failure"
restartPolicyMaxRetries = 10

# ── Service: marketing ───────────────────────────────────────────────────────
[services.marketing.build]
builder      = "nixpacks"
buildCommand = "cd packages/marketing && npm install --include=dev && npm run build"

[services.marketing.deploy]
startCommand            = "node packages/marketing/serve.js"
healthcheckPath         = "/health"
healthcheckTimeout      = 30
restartPolicyType       = "on_failure"
restartPolicyMaxRetries = 5

# ── Environment variable notes ────────────────────────────────────────────────
# Railway injects $DATABASE_URL and $REDIS_URL automatically when you add the
# PostgreSQL and Redis plugins.  All other variables must be added manually in
# the Railway dashboard under Service → Variables.
#
# Required for api service:
#   NODE_ENV=production
#   PORT                     ← Railway sets this automatically
#   JWT_SECRET
#   JWT_REFRESH_SECRET
#   SENDGRID_API_KEY
#   SENDGRID_FROM_EMAIL
#   SENDGRID_FROM_NAME
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION
#   AWS_S3_BUCKET
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   STRIPE_PRICE_STARTER_MONTHLY
#   STRIPE_PRICE_STARTER_ANNUALLY
#   STRIPE_PRICE_GROWTH_MONTHLY
#   STRIPE_PRICE_GROWTH_ANNUALLY
#   FRONTEND_URL             ← set to the marketing service Railway URL
#   PUPPETEER_SKIP_DOWNLOAD=true
#   PATH_TOKEN_SECRET        ← HMAC secret for gated-service (Agent Placement /
#                              FCAIO) 30-day access tokens; min 32 chars
#   SENTRY_DSN_API           ← optional; backend error monitoring (Sentry)
#   VITE_SENTRY_DSN_WEB      ← optional; must be present when packages/web is
#                              built (baked into the SPA bundle)
#   VITE_API_URL             ← leave UNSET on the api service so the SPA calls
#                              the API at the same origin via a relative /api
#                              path. If set, it must be the api service's own
#                              public URL (it is baked into the web bundle).
#
# Required for marketing service:
#   VITE_API_URL             ← set to the api service Railway URL
